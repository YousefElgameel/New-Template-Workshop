# =============================================================================
# Alembic configuration — apps/api (ADR-0004).
#
# The database URL is deliberately NOT in this file: alembic/env.py reads
# DATABASE_URL through app.config.get_settings(), so the same env var drives the
# service and the migration tool and no credential can be committed here.
#
# Run from apps/api (or `uv run --directory apps/api alembic ...`):
#   uv run alembic heads                              # list head revisions (none today)
#   uv run alembic upgrade head --sql                 # OFFLINE SQL for review — no DB needed
#   uv run alembic revision --autogenerate -m "msg"   # needs a reachable dev DB
#   uv run alembic check                              # model/migration drift — needs a DB
# `alembic upgrade head` against a real database is a confirmed HUMAN action;
# agents never run it (.claude/rules/25-sqlalchemy.md).
# =============================================================================

[alembic]
# Migration scripts live next to this file (POSIX path, %(here)s = this dir).
script_location = %(here)s/alembic

# Make `app` importable when alembic is invoked from apps/api.
prepend_sys_path = .

# os.pathsep for the list-valued options above (Alembic >= 1.16 default).
path_separator = os

# Timestamped file names keep `versions/` in chronological order.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s

[post_write_hooks]
# Format + lint every generated revision with the project's ruff (same version
# as the dev group in pyproject.toml).
hooks = ruff_format, ruff_check
ruff_format.type = exec
ruff_format.executable = uv
ruff_format.options = run ruff format REVISION_SCRIPT_FILENAME
ruff_check.type = exec
ruff_check.executable = uv
ruff_check.options = run ruff check --fix REVISION_SCRIPT_FILENAME

# -----------------------------------------------------------------------------
# Logging for the alembic CLI ONLY (consumed by env.py's fileConfig). The
# running service never loads this file: its logging is structlog JSON via
# app/logging_config.py. Plain text on stderr is the right shape for a CLI.
# -----------------------------------------------------------------------------
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
